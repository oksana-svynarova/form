<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form</title>
  <link rel="shortcut icon" href="./img/favicon.png" type="image/png">
  <link href="https://fonts.googleapis.com/css2?family=Eczar:wght@400..800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <main class="main flex">
    <h1 class="title">Form</h1>
    <form action="/register" method="POST" class="form flex">
      <div class="form__info flex">
        <label for="name" class="form__label">Name and surname:</label>
        <input type="text" id="name" name="user_name" class="form__input" placeholder="Your name and surname" required>
        <label for="mail" class="form__label" >Email:</label>
        <input type="email" id="mail" name="user_email" class="form__input" placeholder="Your email" required>
        <label for="password" class="form__label">Password:</label>
        <input type="password" id="password" name="user_password" class="form__input" placeholder="Your password" required>
        <label for="confirm-password" class="form__label">Confirm password:</label>
        <input type="password" id="confirm-password" name="confirm_password" class="form__input" placeholder="Confirm your password" required>
      </div>
      <div class="form__gender">
        <h2 class="subtitle">Your gender:</h2>
        <label class="form__label">
          woman
          <input type="radio" name="gender" class="form__input" required>
          <span class="gender__check"></span>
        </label>
        <label class="form__label">
          man
          <input type="radio" name="gender" class="form__input">
          <span class="gender__check"></span>
        </label>
      </div>
      <div class="form__age flex">
        <label for="age" class="form__label">Age:</label>
        <input type="number" id="age" min="14" max="100" name="user_age" class="form__input" placeholder="Your age" required>
      </div>
      <div class="form__course flex">
        <h2 class="subtitle">Course:</h2>
        <select name="country" class="form__select" required>
          <option value="" selected disabled>Select a course...</option>
          <option value="Front-End">Front-End Development</option>
          <option value="Back-End">Back-End Development</option>
          <option value="PM">Project Management</option>
          <option value="QA">QA Manual</option>
      </select>
      </div>
      <div class="form__address flex">
        <label for="address" class="form__label">Address:</label>
        <textarea name="message" id="address" placeholder="Your address" required class="form__textarea"></textarea>
      </div>
      <div class="form__check">
        <label class="form__label">
          <input type="checkbox" name="consent" class="form__input" required>
          <span class="consent__check"></span>
          I consent to the processing of my personal data
        </label>
      </div>
      <div class="form__btn flex">
        <button type="reset" class="clear__btn">Clear</button>
        <button type="submit" class="submit__btn">Sign up</button>
      </div>
    </form>
  </main>
</body>
</html>
